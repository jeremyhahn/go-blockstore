# Known-red and slow jobs, off the push path: nightly and on workflow_dispatch, in no merge gate. .trivyignore must exist or trivy never scans.

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# The SARIF upload needs security-events: write.
permissions:
  contents: read
  security-events: write

# The template omits this block and then references ${{ env.GO_VERSION }} in
# the fips job, which resolves to empty and hands setup-go no version. Declared
# here; keep it equal to GO_VERSION in ci.yml.
env:
  GO_VERSION: "1.27.2"
  BUILD_TAGS: ''

jobs:
  fips:
    name: FIPS
    runs-on: ubuntu-latest
    # needs: none — nightly runs standalone; build health is ci.yml's job.
    timeout-minutes: 30
    env:
      GOFIPS140: latest
      # fips140=only, not on: non-approved algorithms must fail; fix the call site, never weaken this.
      GODEBUG: fips140=only
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages (FIPS mode)
        run: go build -tags="${BUILD_TAGS}" ./...

      # Must mirror the repository's unit-test invocation (tags, package scope), with only the FIPS environment changed.
      - name: Unit tests (FIPS mode)
        run: go test -count=1 -timeout=900s -tags="${BUILD_TAGS}" ./...

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ONE declaration of the trivy version, shared by both paths below and by
      # the Makefile, so the scanner in CI and the scanner on a developer's
      # machine are the same build. Bump .trivy-version, nothing else.
      - name: Resolve pinned trivy version
        id: trivy_version
        # Read one bare token and fail on a malformed file, matching the Makefile parser.
        run: |
          version=$(awk '{for(i=1;i<=NF;i++){n++;v=$i}} END{if(n==1)print v}' .trivy-version)
          if [ -z "$version" ]; then
            echo "::error::.trivy-version is malformed (empty, whitespace, or multiple tokens); refusing to resolve a scrubbed version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Skipped directories hold code that does not ship. trivy-action is pinned to the peeled commit SHA of its tag.
      - name: Trivy scan (SARIF for code scanning)
        # trivy-action's setup checks out aquasecurity/trivy from github.com
        # with the runner token, which a non-GitHub token cannot authenticate.
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v${{ steps.trivy_version.outputs.version }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,examples
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v${{ steps.trivy_version.outputs.version }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,examples
          trivyignores: .trivyignore

      # Non-GitHub path: the pinned trivy release, checksum-verified by scripts/install-trivy.sh, the same script make install-tools runs.
      - name: Install Trivy (Gitea)
        if: github.server_url != 'https://github.com'
        # Pass the already-resolved version so both nightly paths and the
        # trivy-action inputs share the ONE strict value (the script would also
        # read .trivy-version strictly on its own now, but this keeps the resolve
        # step the single source).
        run: ./scripts/install-trivy.sh /usr/local/bin "${{ steps.trivy_version.outputs.version }}"

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table --skip-dirs test,examples --ignorefile .trivyignore .

      # Misconfiguration scan, advisory, on both forges.
      - name: Trivy misconfiguration scan (advisory, GitHub)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v${{ steps.trivy_version.outputs.version }}
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          exit-code: 0
          format: table
          skip-dirs: test,examples
          trivyignores: .trivyignore

      - name: Trivy misconfiguration scan (advisory, Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners misconfig --exit-code 0 --format table --skip-dirs test,examples --ignorefile .trivyignore .
