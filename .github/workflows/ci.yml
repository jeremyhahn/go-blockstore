# ci-template: v1.15 (customized) — canonical CI for all first-party Go repos.
# Source of truth: software/templates/github-actions/ci.yml in the
# automatethethings repo (devops.md §1/§8/§9). Copied in, never referenced by
# workflow_call: the template lives inside the security boundary and cannot be
# fetched from github.com. Divergence outside the CUSTOMIZE blocks below is a
# defect.
#
# ONE DELIBERATE DIVERGENCE, AHEAD OF THE TEMPLATE (#30): the four tool-install
# steps (golangci-lint, actionlint, gosec, govulncheck) no longer install over
# the binaries the ci-runner image bakes. Template v1.12 still installs all four
# unconditionally, so a straight re-copy of the template WOULD REVERT THIS and
# re-break lint the moment this repo's `go` directive reaches 1.27. Carry this
# forward on the next template sync, or take it from the template once the
# template adopts it.
#
# v1.14/v1.15 (automatethethings#207, #209, #211): every job starts at once, so
# a run takes as long as its slowest job. lint, build, security and test have
# no `needs`; CI Gate, the one required check, needs every job and fails closed
# on any result but success. This supersedes v1.9's staged ordering. push runs
# on main only: automerge.yml v7's merge trains are PRs from merge-train/* and
# get their CI from pull_request like any PR.
#
# `fips` and `trivy` live in nightly.yml, not here (owner ruling 2026-08-20):
# both verify slow-moving properties, and neither gates a merge. They are
# absent from ci-gate as well — a job that is required in one place and not the
# other is the fail-open shape this gate exists to avoid.
#
# Runs identically on Gitea Actions (dev) and GitHub Actions (public mirror);
# host-specific steps are guarded on github.server_url (devops.md §1).

name: CI

on:
  push:
    # trunk-based: main is the ONLY trunk. automerge.yml's merge trains are
    # PRs from merge-train/* and get CI from pull_request (v1.15).
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:                    # re-fire a whole workflow; also the
                                        # only retry when a run was never
                                        # created

permissions:
  contents: read
  security-events: write

env:
  # CUSTOMIZE (go-blockstore, #68): equal to the `go` directive in go.mod.
  # go-enclave raised its module floor to 1.27, and a module cannot pin a
  # dependency whose floor is above its own, so adopting it moved this repo to
  # 1.27 with it. The template's "cockroachdb/swiss" block on 1.27 (2026-08-20,
  # task #121) does not apply here: that module is not in this repo's graph
  # (`go list -m all` measured 2026-09-17), and the ci-runner image seeds
  # go1.27.1 into the toolcache and bakes golangci-lint v2.14.0 built with
  # go1.27.1 (see the lint job below). The Makefile reads the same number from
  # go.mod for `make test-container`.
  GO_VERSION: "1.27.1"
  COVERAGE_THRESHOLD: 90      # CUSTOMIZE: per testing-guidelines.md. The tree is at 100% today

  # CUSTOMIZE (go-blockstore): the build tags every go invocation below
  # carries, COMMA-separated (`drbd,cephrbd`). Comma rather than space so the
  # value is always a single shell word — a space-separated list splits at the
  # wrong moment in half these steps, and gosec takes commas regardless.
  #
  # `drbd` since #3: pkg/drbd is gated behind that tag, so without it here the
  # whole provider is invisible to every step below — built, vetted, linted and
  # tested as zero lines. cephrbd adds itself to the same list. Two other
  # places follow when a tag is added: `run.build-tags` in .golangci.yml, which
  # is what the lint job actually reads, and the Makefile's TAGS default, which
  # is how a developer reproduces this run locally.
  #
  # Setting this does mean every step below runs WITH the tags, so the untagged
  # build stops being covered by them. That build is not incidental — the whole
  # point of the convention is that a binary built without -tags drbd compiles,
  # links no DRBD tooling and lists no "drbd" provider — so the build job
  # checks it explicitly rather than losing it here.
  BUILD_TAGS: 'drbd'

jobs:
  # No job has `needs` (v1.14): all of them start at once.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "${UNFORMATTED}" ]; then
            echo "Files not formatted:"; echo "${UNFORMATTED}"; exit 1
          fi

      - name: Vet
        run: go vet -tags="${BUILD_TAGS}" ./...

      # The whole-tree scanners (#47). This job is the gate `make lint` mirrors,
      # and `lint` depends on `guards`, so without this step the scanners would
      # run only when somebody remembered to type it — a guard that exists but
      # does not run.
      #
      # DELIBERATELY UNTAGGED, unlike every other step here. The scanners read
      # source rather than compiling it, so BUILD_TAGS would not change what
      # they see; passing it would suggest otherwise, and a tag-gated file is
      # precisely where a runtime skip hides from a compile-based check.
      #
      # It prints the EXAMINED counts on a passing run, so the log carries the
      # evidence that the sweep read something. A sweep that printed nothing is
      # what opened #47, and it read as clean.
      - name: Guards
        run: |
          go run ./internal/guards/cmd/guards
          # …and prove the scanners can still fire, against fixtures that hold
          # each violation. The line above only asks whether the tree is clean;
          # a clean answer from a scanner nobody has watched fail is the defect
          # itself. No -run filter on purpose: one matching nothing prints ok.
          go test -count=1 ./internal/guards/

      # PREFER THE BAKED BINARY; NEVER INSTALL OVER IT (#30).
      #
      # `runs-on: ubuntu-latest` resolves to jeremyhahn/ci-runner on every Gitea
      # runner host, and that image BAKES golangci-lint at /usr/local/bin. The
      # step this replaces ran `go install ...@<old pin>` unconditionally, so the
      # baked binary was overwritten on every single run by an older one built
      # with whatever Go setup-go had just provisioned.
      #
      # That is not a cosmetic downgrade. golangci-lint REFUSES to load a config
      # when the Go it was BUILT with is older than the module's target:
      #
      #   can't load config: the Go language version (go1.26) used to build
      #   golangci-lint is lower than the targeted Go version (1.27.1)
      #
      # A `go install` here is always built with GO_VERSION, so on the day this
      # repo's `go` directive moves to 1.27 the install path can never satisfy
      # it — no pin fixes that, only using the image's copy does. The image
      # builds its tools with the portfolio MAXIMUM Go for exactly this reason.
      #
      # A FLOOR, NOT AN EXACT PIN. Requiring equality would make every image
      # bump a fleet-wide red gate until each repo edits this line; requiring a
      # minimum lets the image move ahead while a STALE image (or a fallback
      # install that resolved something older) still fails loudly. Measured
      # Measured 2026-10-07 on this tree at v2.14.0 built with go1.27.1: 0
      # issues, and none of the Go-1.26 panic recorded in the note this replaces.
      #
      # The install is the ABSENT case only — the GitHub mirror's hosted
      # runners bake nothing. It is pinned to the floor rather than @latest so
      # that path is reproducible, and the floor is re-asserted afterwards, so
      # no path can end with a tool below it.
      - name: Provide golangci-lint
        env:
          GOLANGCI_LINT_MIN: "2.14.0"    # keep in step with ci-runner/Dockerfile
        run: |
          set -eu
          if command -v golangci-lint > /dev/null 2>&1; then
            echo "using the image's golangci-lint: $(command -v golangci-lint)"
          else
            echo "golangci-lint absent (expected on the GitHub mirror, NOT on ci-runner)"
            # RETRIED: sum.golang.org tile fetches flake with HTTP/2
            # INTERNAL_ERROR on this fleet (every host resolves AAAA and has no
            # v6 route), and a tool-INSTALL flake must not block the pipeline.
            # Full sumdb verification kept — do NOT "fix" this with GOSUMDB=off,
            # which trades a flake for a supply-chain hole.
            ok=0
            for i in 1 2 3; do
              if go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${GOLANGCI_LINT_MIN}"; then ok=1; break; fi
              echo "install attempt $i failed; retrying"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "golangci-lint install failed after 3 attempts"; exit 1; }
          fi

          # Recorded in the job log on purpose: the workflow file says what was
          # ASKED for, this says what will actually run — and it carries the Go
          # the binary was built with, which is the half that decides whether a
          # 1.27 module can be linted at all.
          echo "golangci-lint reports: $(golangci-lint --version 2>&1 | head -1)"
          if [ -r /etc/ci-runner-tools.txt ]; then
            echo "ci-runner tool manifest:"; cat /etc/ci-runner-tools.txt
          fi

          # `--version` prints "...has version 2.14.0 built with go1.27.1...";
          # head -1 of the semver matches takes the TOOL's version, not the Go
          # one that follows it.
          GOT=$(golangci-lint --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ -n "$GOT" ] || { echo "::error::could not read a golangci-lint version"; exit 1; }
          LOWEST=$(printf '%s\n%s\n' "$GOLANGCI_LINT_MIN" "$GOT" | sort -V | head -1)
          if [ "$LOWEST" != "$GOLANGCI_LINT_MIN" ]; then
            echo "::error::golangci-lint ${GOT} is below the required ${GOLANGCI_LINT_MIN}."
            echo "The ci-runner image is stale — rebuild and push it; do not lower this floor."
            exit 1
          fi
          echo "OK: golangci-lint ${GOT} >= ${GOLANGCI_LINT_MIN}"

      # .golangci.yml enables staticcheck, errcheck, unused, ineffassign,
      # misspell and gocritic (devops.md §8) — the umbrella with the security
      # linters off does not satisfy the gate. Note the linter takes its build
      # tags from `run.build-tags` in that file, not from BUILD_TAGS: the two
      # must be kept in step by hand when a provider tag is added.
      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

      # devops.md §4 puts actionlint in `make lint`, and this job is the gate
      # that `make lint` mirrors — without it the workflows themselves are the
      # only thing in the repo no CI check reads. A misspelled runner label or
      # invalid Actions YAML would reach main having passed a green required
      # gate, and the restricted `codex` label is exactly the kind of string a
      # typo makes inert without failing anything.
      #
      # The labels it accepts come from .github/actionlint.yaml; that file is
      # what keeps self-hosted labels from reading as unknown runners, which is
      # what trains people to ignore linter output.
      #
      # Same shape as golangci-lint above (#30): the ci-runner image bakes
      # actionlint too, and `@latest` both overwrote it and made the gate
      # non-reproducible — the same commit gets linted by a different actionlint
      # on a different day, so a red gate can appear with no commit behind it.
      # Prefer the baked copy; install only when absent, pinned to the floor.
      - name: Provide actionlint
        env:
          ACTIONLINT_MIN: "1.7.7"       # keep in step with ci-runner/Dockerfile
        run: |
          set -eu
          if command -v actionlint > /dev/null 2>&1; then
            echo "using the image's actionlint: $(command -v actionlint)"
          else
            echo "actionlint absent (expected on the GitHub mirror, NOT on ci-runner)"
            ok=0
            for i in 1 2 3; do
              if go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_MIN}"; then ok=1; break; fi
              echo "install attempt $i failed; retrying"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "actionlint install failed after 3 attempts"; exit 1; }
          fi
          echo "actionlint reports: $(actionlint -version 2>&1 | head -1)"
          GOT=$(actionlint -version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ -n "$GOT" ] || { echo "::error::could not read an actionlint version"; exit 1; }
          LOWEST=$(printf '%s\n%s\n' "$ACTIONLINT_MIN" "$GOT" | sort -V | head -1)
          if [ "$LOWEST" != "$ACTIONLINT_MIN" ]; then
            echo "::error::actionlint ${GOT} is below the required ${ACTIONLINT_MIN} — rebuild the ci-runner image."
            exit 1
          fi
          echo "OK: actionlint ${GOT} >= ${ACTIONLINT_MIN}"

      # actionlint delegates every SC-prefixed rule to shellcheck, invoked BY
      # NAME from PATH. With shellcheck absent it DISABLES those rules and still
      # exits 0 at default verbosity — so without this step the actionlint gate
      # below would be a paper gate for the shell inside `run:` steps, which is
      # exactly how a real SC2046 reached main (#21). Pinned and checksum-verified
      # through the same scripts/install-shellcheck.sh that `make install-tools`
      # runs, so the shellcheck in CI and on a dev box are the same binary. It
      # installs to GOPATH/bin, which setup-go has already put on PATH.
      #
      # DELIBERATELY NOT GUARDED like the four steps above (#30). This one is
      # not in that class: it installs to GOPATH/bin and so overwrites nothing
      # the image bakes, and it is version-pinned AND SHA-256-verified against
      # the extracted binary — strictly stronger than trusting whatever is on
      # PATH. Adding a `command -v shellcheck` skip here would reinstate the
      # trust-on-sight fast path that ci-template v1.12 removed from
      # install-shellcheck.sh on purpose (this repo's #22). The cost is one
      # pinned download per run; the benefit is that the SC* rules run against
      # a known binary.
      - name: Install shellcheck
        run: ./scripts/install-shellcheck.sh "$(go env GOPATH)/bin"

      - name: actionlint
        run: actionlint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages
        run: go build -tags="${BUILD_TAGS}" ./...

      # The tag convention's core claim: a binary built WITHOUT the provider
      # tags still compiles, and a package whose files are all excluded is an
      # empty package rather than a build error. Every other step in this
      # workflow runs with BUILD_TAGS set, so this is the only place that
      # claim is tested.
      - name: Build with no build tags
        run: |
          go build ./...
          go vet ./...

      # CUSTOMIZE: no nested modules in this repo. A provider that grows its
      # own module builds here too.

  security:
    name: Security
    runs-on: ubuntu-latest
    # No `needs` (v1.14): starts with lint and build, not after them.
    # THE GO TOOLCHAIN IS CGROUP-UNAWARE. Inside a job container capped at
    # 16 GB, `nproc` still reports the HOST's cores and /proc/meminfo the
    # HOST's memory, so gosec defaults to a worker per host core and the GC has
    # no reason to collect before what it believes is a 94 GB machine fills.
    # Measured 2026-08-18: the heap pinned at the cgroup limit with 10.9 GB
    # swapped, host memory PSI 98, 43% of all CPU in iowait — and because swap
    # absorbed it, nothing OOMed, so it never failed fast. It just thrashed.
    # GOMEMLIMIT makes the GC treat the container budget as real; keep it
    # comfortably below the cap, since non-heap memory lives outside it.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Prefer the baked binary (#30). `@latest` made this gate
      # non-reproducible — the same commit gets scanned by a different analyser
      # on a different day — and it overwrote the image's PINNED copy to do it.
      #
      # gosec CANNOT BE VERSION-ASSERTED FROM ITS OWN OUTPUT. `go install`
      # builds it without the release ldflags, so `gosec --version` prints
      # "Version: dev" whatever was selected (go-luks2 #21). So `dev` in this
      # log must NOT be read as "unpinned", and no floor check is possible here
      # the way it is for golangci-lint. What is possible: never install over
      # the image's ldflags-built copy, print /etc/ci-runner-tools.txt so the
      # log carries the version that actually scanned, and give the fallback the
      # same -ldflags the image uses so the mirror self-reports too.
      - name: Provide gosec
        env:
          GOSEC_VERSION: "v2.29.0"      # keep in step with ci-runner/Dockerfile
        run: |
          set -eu
          if command -v gosec > /dev/null 2>&1; then
            echo "using the image's gosec: $(command -v gosec)"
          else
            echo "gosec absent (expected on the GitHub mirror, NOT on ci-runner)"
            # RETRIED: same sum.golang.org flake class as the lint install — a
            # tool-install network failure must not fail a job that never ran
            # its analysis. Full sumdb verification kept.
            ok=0
            for i in 1 2 3; do
              if go install -ldflags "-X main.Version=${GOSEC_VERSION}" \
                   "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"; then ok=1; break; fi
              echo "install attempt $i failed; retrying"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "gosec install failed after 3 attempts"; exit 1; }
          fi
          echo "gosec reports: $(gosec --version 2>&1 | head -1)"
          if [ -r /etc/ci-runner-tools.txt ]; then
            echo "ci-runner tool manifest:"; cat /etc/ci-runner-tools.txt
          fi

      # CUSTOMIZE (with justification): this repo carries NO -exclude rules,
      # and adding one means writing the reason here, checked against the code,
      # and mirroring it into GOSEC_EXCLUDE/GOSEC_ARGS in the Makefile. The
      # -exclude-dir entries below are directory scoping, not finding
      # suppression: neither directory exists yet, and both are for code that
      # does not ship.
      - name: Run gosec
        # -stdout keeps the findings readable in the job log: the SARIF upload
        # below only runs on github.com, so without it a Gitea failure exits 1
        # with the findings buried in an artifact nobody can see.
        #
        # -concurrency 4 is the part of the memory bound that actually works
        # (v1.7): gosec sizes its worker pool from runtime.NumCPU(), which
        # reports the HOST's cores regardless of GOMAXPROCS, and GOMEMLIMIT
        # cannot collect LIVE heap.
        #
        # Exit code triaged (v1.8): a shell reports a signal death as 128+N, so
        # an OOM kill leaves 137 — indistinguishable from a real finding in the
        # job summary, which is all the Gitea API exposes. Fail-closed either
        # way; this only says which.
        run: |
          set +e
          gosec -concurrency 4 -fmt=sarif -out=gosec.sarif -stdout -verbose=text \
            ${BUILD_TAGS:+-tags=${BUILD_TAGS}} \
            -exclude-dir=test -exclude-dir=examples \
            -severity=medium -confidence=medium ./...
          rc=$?
          set -e
          if [ "$rc" -gt 128 ]; then
            echo "::error::gosec was KILLED by signal $((rc - 128)) — this is NOT a security finding."
            echo "Memory pressure in the job container. Re-run when the host is quieter."
          fi
          exit "$rc"

      - name: Upload gosec SARIF
        # Gitea has no code-scanning API; the upload 404s and fails the job.
        #
        # The fork guard is separate from that: GitHub downgrades the token to
        # read-only for a pull_request from a fork REGARDLESS of the
        # `permissions:` block above, so this step would fail with a
        # permissions error on an external contributor's PR even when gosec
        # itself passed — failing the PR for something the contributor cannot
        # fix. Defensive today (version-control.md §3 makes github.com a
        # push-only mirror, so no PR is opened there), but the guard costs
        # nothing and the alternative is a confusing red the day that changes.
        # On non-PR events `github.event.pull_request` is null, so the
        # comparison is true and the upload still runs.
        if: >-
          always() && github.server_url == 'https://github.com'
          && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

      # Prefer the baked binary (#30), same reasoning as gosec above. Unlike
      # gosec, govulncheck DOES report its own version truthfully whichever way
      # it was built ("Scanner: govulncheck@v1.8.0"), so the floor is checkable.
      - name: Provide govulncheck
        env:
          GOVULNCHECK_MIN: "1.7.0"      # keep in step with ci-runner/Dockerfile
        run: |
          set -eu
          if command -v govulncheck > /dev/null 2>&1; then
            echo "using the image's govulncheck: $(command -v govulncheck)"
          else
            echo "govulncheck absent (expected on the GitHub mirror, NOT on ci-runner)"
            ok=0
            for i in 1 2 3; do
              if go install "golang.org/x/vuln/cmd/govulncheck@v${GOVULNCHECK_MIN}"; then ok=1; break; fi
              echo "install attempt $i failed; retrying"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "govulncheck install failed after 3 attempts"; exit 1; }
          fi
          # The whole preamble goes in the log; the version is then read by
          # ANCHORING ON "govulncheck@v" rather than matching a bare semver.
          # Line 1 is "Go: go1.27.1" — the Go the SCAN runs under — and a bare
          # semver match would take that instead of the scanner's version.
          govulncheck -version 2>&1 | head -4
          GOT=$(govulncheck -version 2>&1 | sed -n 's/.*govulncheck@v\([0-9.]*\).*/\1/p' | head -1)
          [ -n "$GOT" ] || { echo "::error::could not read a govulncheck version"; exit 1; }
          LOWEST=$(printf '%s\n%s\n' "$GOVULNCHECK_MIN" "$GOT" | sort -V | head -1)
          if [ "$LOWEST" != "$GOVULNCHECK_MIN" ]; then
            echo "::error::govulncheck ${GOT} is below the required ${GOVULNCHECK_MIN} — rebuild the ci-runner image."
            exit 1
          fi
          echo "OK: govulncheck ${GOT} >= ${GOVULNCHECK_MIN}"

      # Also the toolchain-currency forcing function: fails on stdlib vulns in
      # an outdated Go (devops.md §9). Exit code triaged for the same reason as
      # gosec above — govulncheck holds the whole package graph and its SSA
      # live, so GOMEMLIMIT cannot help it, and a bare 137 reads as
      # "vulnerabilities found" and sends someone hunting a CVE that does not
      # exist (measured on go-quicbaas).
      - name: Run govulncheck
        run: |
          # govulncheck has no -tags flag of its own; it reads GOFLAGS. Set in
          # the shell rather than in an `env:` expression so the empty case is
          # a plain empty string and not a workflow-expression edge case.
          export GOFLAGS="${BUILD_TAGS:+-tags=${BUILD_TAGS}}"
          set +e
          govulncheck ./...
          rc=$?
          set -e
          if [ "$rc" -gt 128 ]; then
            echo "::error::govulncheck was KILLED by signal $((rc - 128)) — this is NOT a vulnerability finding."
            echo "Memory pressure in the job container, not a CVE. Re-run when the host is quieter."
            echo "Confirm locally with an uncapped 'govulncheck ./...' before treating it as a finding."
          fi
          exit "$rc"

      - name: Verify module integrity
        run: go mod verify

  test:
    name: Test
    runs-on: ubuntu-latest
    # No `needs` (v1.14): every job starts at once; CI Gate fails closed on
    # any of them.
    timeout-minutes: 15       # CUSTOMIZE: two packages of unit tests; the
                              # 900s go-test bound below fires first on a hang
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # CUSTOMIZE: no repo-specific environment tuning yet. Providers that need
      # kernel state (DRBD) do NOT get it here — they belong in an integration
      # job with a runner that has it, not in the unit-test job.

      - name: Run tests with coverage
        run: |
          go test -race -count=1 -timeout=900s -tags="${BUILD_TAGS}" \
            -covermode=atomic -coverprofile=coverage.out ./...
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "${COVERAGE} < ${{ env.COVERAGE_THRESHOLD }}" | bc -l)" -eq 1 ]; then
            echo "FAIL: coverage ${COVERAGE}% is below minimum ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi

  # The single required check (devops.md §1). Every job above appears in BOTH
  # the needs list and the results check — a gate that can pass vacuously is
  # worse than no gate. Do not use join(needs.*.result): it evaluates empty on
  # Gitea and reports success while jobs fail.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, security, build, test]
    steps:
      - name: Fail closed on any non-success
        env:
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_SECURITY: ${{ needs.security.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_TEST: ${{ needs.test.result }}
        run: |
          # skipped != failed, but BOTH fail the gate: a job that never ran
          # proved nothing, and naming it keeps it loud instead of letting a
          # red gate read as a test failure while the tests never ran
          # (go-qrdb#42). An unreadable (empty)
          # result fails closed rather than passing.
          BAD=0
          check() {
            case "$2" in
              success) echo "OK   $1" ;;
              skipped) echo "SKIP $1 (did not run — see its job)";              BAD=1 ;;
              "")      echo "FAIL $1 result is unreadable — failing closed";    BAD=1 ;;
              *)       echo "FAIL $1 ($2)";                                     BAD=1 ;;
            esac
          }
          check lint     "$RESULT_LINT"
          check security "$RESULT_SECURITY"
          check build    "$RESULT_BUILD"
          check test     "$RESULT_TEST"
          exit $BAD
