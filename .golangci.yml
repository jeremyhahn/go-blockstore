# golangci-lint v2 configuration; the timeout is passed by the Makefile and CI, not set here.
version: "2"

run:
  # Test files are linted.
  tests: true

  # Build tags of the tag-gated providers; keep in step with the Makefile TAGS and CI BUILD_TAGS.
  build-tags:
    - drbd

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jeremyhahn/go-blockstore

linters:
  # errcheck, staticcheck, unused, ineffassign, misspell and gocritic are mandatory and stay enabled.
  enable:
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocritic
    - govet
    - gosec
    - errname
    - errorlint
    - copyloopvar
    - unconvert
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      settings:
        hugeParam:
          # 256 bytes: VolumeSpec and ha.Status are passed by value by contract.
          sizeThreshold: 256
    govet:
      enable:
        - shadow
    misspell:
      locale: US

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    # Test-only exclusions; each new one needs a reason next to it.
    rules:
      # Tests construct fixtures whose errors are the assertion itself, and
      # deliberately ignore returns while exercising a failure path.
      - linters:
          - errcheck
          - gosec
        path: _test\.go$
